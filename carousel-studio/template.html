<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel</title>
<style>
  /* Brand tokens: replace with the values in brand-brain. */
  :root{
    --bg:#0d282b; --text:#fffdf4; --accent:#d7fd64;
    --head:"Poppins", system-ui, sans-serif; --body:"Poppins", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--text);
         font-family:var(--body);-webkit-font-smoothing:antialiased}
  .slide > .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0 0 auto 0;height:60%;
         background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0))}
  .top{position:absolute;left:96px;right:96px;top:84px;display:flex;justify-content:space-between;
       font-size:24px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.72}
  .block{position:absolute;left:96px;right:120px;top:170px}
  .num{display:inline-block;background:var(--accent);color:var(--bg);font-weight:700;font-size:30px;
       padding:6px 18px;border-radius:12px;margin-bottom:26px}
  h1{font-family:var(--head);font-weight:600;font-size:74px;line-height:1.06;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:600;font-size:70px;line-height:1.05;letter-spacing:-.02em;margin-bottom:30px}
  em{font-style:normal;color:var(--accent)}
  p{font-size:33px;line-height:1.34;margin-bottom:12px;max-width:820px}
  .foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;justify-content:space-between;font-size:26px;font-weight:500}
</style>
</head>
<body>

<!-- One <div class="slide"> per slide. Keep one headline and at most three short lines. -->
<div class="slide">
  <!-- <img class="scene" src="assets/scene-0.png" alt=""> -->
  <div class="scrim"></div>
  <div class="top"><span>kicker</span><span>1/3</span></div>
  <div class="block">
    <h1>Hook goes here with one <em>accent</em> word</h1>
  </div>
  <div class="foot"><span>@handle</span><span>swipe →</span></div>
</div>

<div class="slide">
  <div class="top"><span>kicker</span><span>2/3</span></div>
  <div class="block">
    <span class="num">01</span>
    <h2>Point one</h2>
    <p>One or two short lines that deliver the point.</p>
  </div>
  <div class="foot"><span>@handle</span><span>swipe →</span></div>
</div>

<div class="slide">
  <div class="top"><span>kicker</span><span>3/3</span></div>
  <div class="block">
    <h2>The closer</h2>
    <p>The call to action from brand-brain.</p>
  </div>
  <div class="foot"><span>@handle</span><span>save this</span></div>
</div>

<script>
  // render.py opens this page with ?slide=N so each screenshot shows exactly one slide.
  const n = new URLSearchParams(location.search).get("slide");
  if (n !== null) {
    document.querySelectorAll(".slide").forEach((s, i) => { if (String(i) !== n) s.style.display = "none"; });
  }
</script>
</body>
</html>
