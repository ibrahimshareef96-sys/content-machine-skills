<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel</title>
<!-- Label and mono faces. Google Fonts is the only remote file render.py lets through. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Brand tokens: replace with the values in brand-brain. The defaults are the Shareefico "Ranked" look:
     graphite ground, bone text, one accent (a tier colour, here green #34D07F) on one word or shape per slide.
     Satoshi is not a Google Font: install it on the computer or put the brain's headline font here; the
     system sans stands in when it is missing. */
  :root{
    --bg:#15151C; --text:#F4F1EA; --muted:#A6A4B0; --accent:#34D07F; --on-accent:#15151C;
    --head:"Satoshi", system-ui, sans-serif; --body:"Satoshi", system-ui, sans-serif;
    --label:"Unbounded", Verdana, sans-serif; --mono:"IBM Plex Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg)}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--text);
         font-family:var(--body);font-weight:500;-webkit-font-smoothing:antialiased}
  .slide > .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* A soft dark pool under the words when a scene sits behind them. */
  .scrim{position:absolute;inset:0 0 auto 0;height:60%;
         background:linear-gradient(to bottom, rgba(21,21,28,.6), rgba(21,21,28,0))}
  .top{position:absolute;left:88px;right:88px;top:88px;display:flex;justify-content:space-between;
       font-family:var(--label);font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .block{position:absolute;left:88px;right:120px;top:190px}
  .num{display:inline-block;background:var(--accent);color:var(--on-accent);font-family:var(--label);font-weight:700;
       font-size:28px;letter-spacing:.04em;padding:8px 20px;border-radius:8px;margin-bottom:30px}
  h1{font-family:var(--head);font-weight:900;font-size:120px;line-height:.9;letter-spacing:-.05em;text-wrap:balance}
  h2{font-family:var(--head);font-weight:900;font-size:96px;line-height:.92;letter-spacing:-.05em;margin-bottom:34px;text-wrap:balance}
  em{font-style:normal;color:var(--accent)}
  p{font-size:36px;line-height:1.38;margin-bottom:12px;max-width:820px;color:var(--muted)}
  code{font-family:var(--mono);font-size:.86em}
  .foot{position:absolute;left:88px;right:88px;bottom:72px;display:flex;justify-content:space-between;
        font-family:var(--label);font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
</style>
</head>
<body>

<!-- One <div class="slide"> per slide. Keep one headline and at most three short lines. -->
<div class="slide">
  <!-- <img class="scene" src="assets/scene-0.png" alt=""> -->
  <div class="scrim"></div>
  <div class="top"><span>kicker</span><span>1/3</span></div>
  <div class="block">
    <h1>Hook goes here with one <em>accent</em> word</h1>
  </div>
  <div class="foot"><span>@handle</span><span>swipe →</span></div>
</div>

<div class="slide">
  <div class="top"><span>kicker</span><span>2/3</span></div>
  <div class="block">
    <span class="num">01</span>
    <h2>Point one</h2>
    <p>One or two short lines that deliver the point.</p>
  </div>
  <div class="foot"><span>@handle</span><span>swipe →</span></div>
</div>

<div class="slide">
  <div class="top"><span>kicker</span><span>3/3</span></div>
  <div class="block">
    <h2>The closer</h2>
    <p>The call to action from brand-brain.</p>
  </div>
  <div class="foot"><span>@handle</span><span>save this</span></div>
</div>

<script>
  // render.py opens this page with ?slide=N so each screenshot shows exactly one slide.
  const n = new URLSearchParams(location.search).get("slide");
  if (n !== null) {
    document.querySelectorAll(".slide").forEach((s, i) => { if (String(i) !== n) s.style.display = "none"; });
  }
</script>
</body>
</html>
